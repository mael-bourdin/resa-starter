name: Source de la PR

# Une PR vers main doit venir de develop (ou de la PR de release-please).
# Ce check est obligatoire dans le ruleset « Protéger main ».
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que la PR vient de develop
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::La PR doit venir de ce dépôt, pas d'un fork."
            exit 1
          fi
          case "$HEAD_REF" in
            develop | release-please--*)
              echo "OK : la PR vient de $HEAD_REF"
              ;;
            *)
              echo "::error::Une PR vers main doit venir de develop (reçu : $HEAD_REF)."
              exit 1
              ;;
          esac
